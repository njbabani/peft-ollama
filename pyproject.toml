[project]
name = "groundedqa"
version = "0.2.0"
description = "Grounded QA: LoRA fine-tuning (PEFT), hybrid retrieval (dense + BM25 + cross-encoder) and calibrated abstention on SQuAD v2"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "accelerate>=1.15.0",
    "bm25s>=0.3.11",
    "datasets>=5.0.1",
    "huggingface-hub>=1.33.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "peft>=0.21.0",
    "pystemmer>=3.1.0",
    "safetensors>=0.8.0",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
]

[project.scripts]
groundedqa = "groundedqa:main"

[project.optional-dependencies]
demo = [
    "gradio>=6.28.0",
]
deploy = [
    "sentencepiece>=0.2.2",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
